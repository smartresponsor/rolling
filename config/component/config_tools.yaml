config_tools:
  - application_code: Rolling
    tool_code: rolling.role_runtime
    label: Rolling Role Runtime
    description: Runtime knobs for the Rolling role subsystem.
    form_class: App\Rolling\Form\Config\RollingConfigurationRoleRuntimeFormType
    service_class: App\Rolling\Service\Config\RollingConfigurationRoleRuntimeService
    required_permission: administration.config.update
    editable_fields:
      - enabled
      - policyNamespace
      - adminNamespace
      - auditNamespace
      - opsDir
      - sdkNamespace
    sensitive_fields: []
    readable_files:
      - config/component/runtime.yaml
    writable_files:
      - config/component/runtime.yaml
    metadata:
      section: Configuration
      kind: runtime
    secret_names: []
    apply_strategy: component_runtime_yaml
