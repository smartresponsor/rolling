services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Administering\ServiceInterface\Admin\AdministrationOwnerConfigurationToolProviderInterface:
      tags: ['administering.owner_configuration_tool_provider']
    App\Administering\ServiceInterface\Config\AdministrationConfigToolServiceInterface:
      tags: ['administering.config_tool']
