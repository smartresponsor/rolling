services:
  _defaults:
    autowire: true
    autoconfigure: true

  _instanceof:
    App\Configuring\ServiceInterface\Tool\ConfigurationToolProviderInterface:
      tags: ['configuring.configuration_tool_provider']
    App\Configuring\ServiceInterface\Config\ConfigToolServiceInterface:
      tags: ['configuring.config_tool']
    App\Rolling\ServiceInterface\Policy\VoterInterface:
      tags: ['rolling.policy_voter']


  App\Rolling\Command\:
    resource: '../src/Command/'

  App\Rolling\Infrastructure\Observability\Metrics\:
    resource: '../src/Infrastructure/Observability/Metrics/'


  App\Rolling\Service\:
    resource: '../src/Service/'
    exclude:
      - '../src/Service/Admin/RebacStatsService.php'
      - '../src/Service/Attribute/AttributeContextResolverService.php'
      - '../src/Service/Obligation/'

  App\Rolling\ServiceInterface\Cruding\RollingCrudResourceDefinitionProviderInterface:
    alias: 'App\Rolling\Service\Cruding\RollingCrudResourceDefinitionProvider'
    public: true

  App\Rolling\Service\Config\RollingConfigurationRoleRuntimeService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Rolling\Service\Config\RollingConfigurationRoleHierarchyService:
    arguments:
      $projectDir: '%kernel.project_dir%'

  App\Rolling\Repository\:
    resource: '../src/Repository/'

  App\Rolling\Infrastructure\Rebac\InMemoryTupleStore: ~
  App\Rolling\InfrastructureInterface\Rebac\TupleStoreInterface: '@App\Rolling\Infrastructure\Rebac\InMemoryTupleStore'

  App\Rolling\Infrastructure\Admin\InMemoryApprovalRequestRepository: ~
  App\Rolling\InfrastructureInterface\Admin\ApprovalRequestRepositoryInterface: '@App\Rolling\Infrastructure\Admin\InMemoryApprovalRequestRepository'

  App\Rolling\ServiceInterface\Admin\Guard\ApprovalGuardInterface: '@App\Rolling\Service\Admin\Guard\FourEyesApprovalGuard'
  App\Rolling\ServiceInterface\Admin\Action\GrantRoleActionInterface: '@App\Rolling\Service\Admin\Action\GrantRoleAction'
  App\Rolling\Service\Admin\Action\GrantRoleAction:
    arguments:
      $reportDir: '%kernel.project_dir%/var/admin'

  App\Rolling\Infrastructure\Admin\OverrideFsPolicy:
    arguments:
      $baseDir: '%kernel.project_dir%/var/admin'
  App\Rolling\ServiceInterface\Admin\OverridePolicyInterface: '@App\Rolling\Infrastructure\Admin\OverrideFsPolicy'

  App\Rolling\Infrastructure\Admin\ApprovalFsStore:
    arguments:
      $baseDir: '%kernel.project_dir%/var/admin'
  App\Rolling\ServiceInterface\Admin\ApprovalStoreInterface: '@App\Rolling\Infrastructure\Admin\ApprovalFsStore'

  App\Rolling\Infrastructure\Admin\ApproverFsDirectory:
    arguments:
      $baseDir: '%kernel.project_dir%/var/admin'
  App\Rolling\ServiceInterface\Admin\ApproverDirectoryInterface: '@App\Rolling\Infrastructure\Admin\ApproverFsDirectory'

  App\Rolling\Integration\Symfony\DemoPdpV2: ~

  App\Rolling\Service\Model\FileSchemaStorage:
    arguments:
      $path: '%kernel.project_dir%/var/rolling/model_schema.json'
  App\Rolling\ServiceInterface\Model\SchemaStorageInterface: '@App\Rolling\Service\Model\FileSchemaStorage'

  App\Rolling\ServiceInterface\Policy\PdpV2Interface: '@App\Rolling\Integration\Symfony\DemoPdpV2'

  App\Rolling\ServiceInterface\Administration\RollingAdministrationPermissionCatalogInterface: '@App\Rolling\Service\Administration\RollingAdministrationPermissionCatalog'
  App\Rolling\ServiceInterface\Administration\RollingAclAdministrationServiceInterface: '@App\Rolling\Service\Administration\DoctrineRollingAclAdministrationService'
  App\Rolling\ServiceInterface\Administration\RollingAdministrationPermissionDecisionServiceInterface: '@App\Rolling\Service\Administration\DoctrineRollingAdministrationPermissionDecisionService'
  App\Rolling\ServiceInterface\Administration\RollingFieldAccessDecisionServiceInterface: '@App\Rolling\Service\Administration\DoctrineRollingFieldAccessDecisionService'
  App\Rolling\ServiceInterface\Administration\RollingAdministrationCatalogSyncServiceInterface: '@App\Rolling\Service\Administration\DoctrineRollingAdministrationCatalogSyncService'
  App\Rolling\ServiceInterface\Administration\RollingAdministrationSubjectAccessReportProviderInterface: '@App\Rolling\Service\Administration\DoctrineRollingAdministrationSubjectAccessReportProvider'
  App\Rolling\ServiceInterface\Administration\RollingRoleHierarchyMutationServiceInterface: '@App\Rolling\Service\Administration\DoctrineRollingRoleHierarchyMutationService'


  App\Rolling\ServiceInterface\Administration\RollingAclManifestBuilderInterface: '@App\Rolling\Service\Administration\RollingAclManifestBuilder'

  App\Rolling\ServiceInterface\Administration\RollingAclManifestExporterInterface: '@App\Rolling\Service\Administration\RollingAclManifestExporter'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationAuditRecorderInterface: '@App\Rolling\Service\Administration\NullRollingAclMutationAuditRecorder'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationValidatorInterface: '@App\Rolling\Service\Administration\RollingAclMutationValidator'
  App\Rolling\ServiceInterface\Administration\RollingAclMutationPlannerInterface: '@App\Rolling\Service\Administration\RollingAclMutationPlanner'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationReviewBuilderInterface: '@App\Rolling\Service\Administration\RollingAclMutationReviewBuilder'


  App\Rolling\ServiceInterface\Administration\RollingAclMutationReviewArtifactExporterInterface: '@App\Rolling\Service\Administration\RollingAclMutationReviewArtifactExporter'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationApplyRequestBuilderInterface: '@App\Rolling\Service\Administration\RollingAclMutationApplyRequestBuilder'
  App\Rolling\ServiceInterface\Administration\RollingAclMutationApplyServiceInterface: '@App\Rolling\Service\Administration\RollingAclMutationApplyService'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationExecutionGatewayInterface: '@App\Rolling\Service\Administration\RollingAclMutationExecutionGateway'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationExecutionEventRecorderInterface: '@App\Rolling\Service\Administration\DoctrineRollingAclMutationExecutionEventRecorder'

  App\Rolling\ServiceInterface\Administration\RollingAclMutationExecutionReportProviderInterface: '@App\Rolling\Service\Administration\DoctrineRollingAclMutationExecutionReportProvider'


  App\Rolling\ServiceInterface\Administration\RollingAclAdministrationReadinessReportProviderInterface: '@App\Rolling\Service\Administration\RollingAclAdministrationReadinessReportProvider'

  App\Rolling\ServiceInterface\Administration\RollingAclStorageReadinessReportProviderInterface: '@App\Rolling\Service\Administration\RollingAclStorageReadinessReportProvider'

  App\Rolling\ServiceInterface\Administration\RollingAclRemediationPlanProviderInterface: '@App\Rolling\Service\Administration\RollingAclRemediationPlanProvider'

  App\Rolling\ServiceInterface\Administration\RollingAclWorkPlanProviderInterface: '@App\Rolling\Service\Administration\RollingAclWorkPlanProvider'

  App\Rolling\ServiceInterface\Administration\RollingAclExecutionPlanProviderInterface: '@App\Rolling\Service\Administration\RollingAclExecutionPlanProvider'

  App\Rolling\ServiceInterface\Administration\RollingAclCapabilityMatrixProviderInterface: '@App\Rolling\Service\Administration\RollingAclCapabilityMatrixProvider'
  App\Rolling\ServiceInterface\Administration\RollingAclAdministrationContractMatrixProviderInterface: '@App\Rolling\Service\Administration\RollingAclAdministrationContractMatrixProvider'
  App\Rolling\ServiceInterface\Administration\RollingAclHealthReportProviderInterface: '@App\Rolling\Service\Administration\RollingAclHealthReportProvider'
  App\Rolling\ServiceInterface\Administration\RollingAclDiagnosticReportProviderInterface: '@App\Rolling\Service\Administration\RollingAclDiagnosticReportProvider'
  App\Rolling\ServiceInterface\View\RollSurfaceProviderInterface: '@App\Rolling\Service\View\RollSurfaceProvider'

  App\Rolling\Infrastructure\Policy\PolicyFsStore:
    arguments:
      $dir: '%kernel.project_dir%/var/policy'

  App\Rolling\ServiceInterface\PolicyStoreInterface: '@App\Rolling\Infrastructure\Policy\PolicyFsStore'

  App\Rolling\Infrastructure\Approval\FileApprovalStore:
    arguments:
      $dir: '%kernel.project_dir%/var/approval'
  App\Rolling\ServiceInterface\Approval\ApprovalStoreInterface: '@App\Rolling\Infrastructure\Approval\FileApprovalStore'

  App\Rolling\Infrastructure\Security\HmacKeyFsStore:
    arguments:
      $baseDir: '%kernel.project_dir%/var/keys'

  App\Rolling\Infrastructure\Security\JwksFsVerifier: ~

  App\Rolling\InfrastructureInterface\Security\KeyStoreInterface: '@App\Rolling\Infrastructure\Security\HmacKeyFsStore'
  App\Rolling\InfrastructureInterface\Security\JwksVerifierInterface: '@App\Rolling\Infrastructure\Security\JwksFsVerifier'

  App\Rolling\Infrastructure\Acl\Source\DefaultGithubSubjectResolver: ~
  App\Rolling\InfrastructureInterface\Acl\Source\GithubSubjectResolverInterface: '@App\Rolling\Infrastructure\Acl\Source\DefaultGithubSubjectResolver'

  App\Rolling\Infrastructure\Residency\ResidencyFsPolicy:
    arguments:
      $file: '%kernel.project_dir%/config/role/residency.json'

  App\Rolling\ServiceInterface\Residency\ResidencyPolicyInterface: '@App\Rolling\Infrastructure\Residency\ResidencyFsPolicy'


  App\Rolling\Controller\Admin\:
    resource: '../src/Controller/Admin/'
    exclude:
      - '../src/Controller/Admin/RollingPermissionCrudController.php'
    public: true
    tags: ['controller.service_arguments']

  # HTTP endpoint services are intentionally routed as services.
  # Native EasyAdmin controllers remain allowed only under src/Controller/Admin/*.
  App\Rolling\Service\Http\Role\:
    resource: '../src/Service/Http/Role/'
    public: true
    tags: ['controller.service_arguments']
