role_keys_sign:
  path: /v2/keys/sign
  methods: [ POST ]
  controller: 'App\Rolling\Service\Http\Role\Api\SecurityHttpService::sign'

role_keys_verify:
  path: /v2/keys/verify
  methods: [ POST ]
  controller: 'App\Rolling\Service\Http\Role\Api\SecurityHttpService::verify'

role_keys_rotate:
  path: /v2/keys/rotate
  methods: [ POST ]
  controller: 'App\Rolling\Service\Http\Role\Api\SecurityHttpService::rotate'

role_keys_jwks_get:
  path: /v2/keys/jwks
  methods: [ GET ]
  controller: 'App\Rolling\Service\Http\Role\Api\SecurityHttpService::jwksGet'

role_keys_jwks_put:
  path: /v2/keys/jwks
  methods: [ POST ]
  controller: 'App\Rolling\Service\Http\Role\Api\SecurityHttpService::jwksPut'
